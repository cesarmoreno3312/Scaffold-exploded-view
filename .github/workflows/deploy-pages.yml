name: Publicar app Ring Lock (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Compilar, probar y publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas
        run: npm test
      - name: Preparar sitio estático
        run: |
          mkdir -p public/src public/data
          cp index.html public/index.html
          cp src/app.mjs src/engine.mjs src/styles.css public/src/
          cp data/catalogo.json public/data/
          touch public/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
